AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Preparacao da conta para o deploy automatizado da plataforma de feedback:
  o papel IAM que o GitHub Actions assume por OIDC e o repositorio do Amazon
  ECR que guarda a imagem das funcoes. Criado uma unica vez por conta AWS.

Parameters:
  DonoDoRepositorio:
    Type: String
    Default: caiotelesz
    Description: Usuario ou organizacao dona do repositorio no GitHub
  NomeDoRepositorio:
    Type: String
    Default: adjt-fase4-feeback
    Description: Nome do repositorio no GitHub
  IdDoDono:
    Type: String
    Default: '103958122'
    AllowedPattern: '[0-9]+'
    Description: Identificador numerico do dono (gh api repos/DONO/NOME --jq .owner.id)
  IdDoRepositorio:
    Type: String
    Default: '1422795260'
    AllowedPattern: '[0-9]+'
    Description: Identificador numerico do repositorio (gh api repos/DONO/NOME --jq .id)
  NomeDaPilha:
    Type: String
    Default: feedback-platform
    Description: Nome da pilha publicada pelo pipeline
  CriarProvedorOidc:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Use false se a conta ja tiver o provedor token.actions.githubusercontent.com

Conditions:
  CriarProvedor: !Equals [!Ref CriarProvedorOidc, 'true']

Resources:
  ProvedorGitHub:
    Type: AWS::IAM::OIDCProvider
    Condition: CriarProvedor
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  # Guarda a imagem de conteiner das funcoes. O pipeline envia uma imagem por
  # versao publicada; as mais antigas sao removidas automaticamente.
  RepositorioDeImagens:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref NomeDaPilha
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Mantem apenas as 10 imagens mais recentes",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }
      # O servico Lambda precisa ler a imagem para criar e atualizar as funcoes
      RepositoryPolicyText:
        Version: '2012-10-17'
        Statement:
          - Sid: LeituraPeloLambda
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Condition:
              StringLike:
                aws:sourceArn: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*'

  PapelDeDeploy:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${NomeDaPilha}-github-deploy'
      Description: Assumido pelo GitHub Actions para o deploy da plataforma de feedback
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !If
                - CriarProvedor
                - !Ref ProvedorGitHub
                - !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Somente a branch main e o ambiente "producao" deste repositorio.
                # O GitHub identifica o repositorio pelo nome acompanhado dos
                # identificadores numericos (dono@id/nome@id), que nao mudam se
                # a conta ou o repositorio forem renomeados. O formato antigo,
                # so com os nomes, e mantido por compatibilidade.
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${DonoDoRepositorio}@${IdDoDono}/${NomeDoRepositorio}@${IdDoRepositorio}:ref:refs/heads/main'
                  - !Sub 'repo:${DonoDoRepositorio}@${IdDoDono}/${NomeDoRepositorio}@${IdDoRepositorio}:environment:producao'
                  - !Sub 'repo:${DonoDoRepositorio}/${NomeDoRepositorio}:ref:refs/heads/main'
                  - !Sub 'repo:${DonoDoRepositorio}/${NomeDoRepositorio}:environment:producao'
      Policies:
        - PolicyName: deploy-da-plataforma
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PilhasDaPlataformaEDoSam
                Effect: Allow
                Action: cloudformation:*
                Resource:
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${NomeDaPilha}/*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31'
              - Sid: ConsultasDoCloudFormation
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStacks
                  - cloudformation:ValidateTemplate
                Resource: '*'
              - Sid: BucketDeArtefatosDoSam
                Effect: Allow
                Action: s3:*
                Resource:
                  - arn:aws:s3:::aws-sam-cli-managed-default-*
                  - arn:aws:s3:::aws-sam-cli-managed-default-*/*
              - Sid: PapeisDasFuncoes
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${NomeDaPilha}-*'
              - Sid: LoginNoRegistroDeImagens
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: EnvioELeituraDaImagemDasFuncoes
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                  - ecr:GetDownloadUrlForLayer
                  - ecr:GetRepositoryPolicy
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:SetRepositoryPolicy
                  - ecr:UploadLayerPart
                Resource: !GetAtt RepositorioDeImagens.Arn
              # Na primeira vez que a conta usa o API Gateway, a AWS cria o papel
              # vinculado ao servico; quem faz o deploy precisa poder cria-lo.
              - Sid: PapelVinculadoAoApiGateway
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ops.apigateway.amazonaws.com/AWSServiceRoleForAPIGateway'
                Condition:
                  StringEquals:
                    iam:AWSServiceName: ops.apigateway.amazonaws.com
              - Sid: ServicosUsadosPelaPlataforma
                Effect: Allow
                Action:
                  - apigateway:*
                  - cloudwatch:*
                  - dynamodb:*
                  - events:*
                  - lambda:*
                  - logs:*
                  - sns:*
                  - sqs:*
                Resource: '*'

Outputs:
  RepositorioDeImagensUri:
    Description: Endereco do repositorio de imagens das funcoes
    Value: !GetAtt RepositorioDeImagens.RepositoryUri
  PapelArn:
    Description: Valor do secret AWS_DEPLOY_ROLE_ARN no GitHub
    Value: !GetAtt PapelDeDeploy.Arn
