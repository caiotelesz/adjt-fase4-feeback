AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Plataforma serverless de feedback de aulas (Tech Challenge Fase 4)

Parameters:
  EmailRemetente:
    Type: String
    Description: E-mail remetente, precisa estar verificado no SES
    AllowedPattern: '[^@\s]+@[^@\s]+\.[^@\s]+'
  EmailAdmin:
    Type: String
    Description: E-mail do administrador, recebe alertas, relatorio e alarmes
    AllowedPattern: '[^@\s]+@[^@\s]+\.[^@\s]+'
  FusoHorario:
    Type: String
    Description: Fuso horario usado nas datas dos e-mails e no agrupamento por dia do relatorio
    Default: America/Sao_Paulo
    AllowedPattern: '[A-Za-z]+(/[A-Za-z0-9_+-]+)*'
    ConstraintDescription: Informe um fuso no formato Area/Local, por exemplo America/Sao_Paulo
  ImagemUri:
    Type: String
    Description: Imagem de conteiner das funcoes no Amazon ECR (repositorio@digest ou repositorio:tag)
  Versao:
    Type: String
    Description: Versao da aplicacao publicada (definida pelo pipeline)
    Default: desenvolvimento
  Commit:
    Type: String
    Description: Identificador curto do commit publicado (definido pelo pipeline)
    Default: local

Globals:
  Function:
    Architectures:
      - arm64
    MemorySize: 512
    Timeout: 15
    Tracing: Active
    Environment:
      Variables:
        FUSO_HORARIO: !Ref FusoHorario
        VERSAO: !Ref Versao
        COMMIT: !Ref Commit
  Api:
    OpenApiVersion: 3.0.1
    TracingEnabled: true

Resources:
  # ---------------------------------------------------------------------------
  # Dados
  # ---------------------------------------------------------------------------
  AvaliacoesTable:
    Type: AWS::DynamoDB::Table
    # Os feedbacks sobrevivem a remocao ou substituicao da pilha
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: diaEnvio
          AttributeType: S
        - AttributeName: dataEnvio
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        # Consulta por periodo sem varrer a tabela: particao = dia, ordenacao = instante do envio
        - IndexName: por-dia
          KeySchema:
            - AttributeName: diaEnvio
              KeyType: HASH
            - AttributeName: dataEnvio
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ---------------------------------------------------------------------------
  # Mensageria
  # ---------------------------------------------------------------------------
  AlertasCriticosTopic:
    Type: AWS::SNS::Topic
    Properties:
      KmsMasterKeyId: alias/aws/sns

  NotificacaoDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  AlarmesTopic:
    Type: AWS::SNS::Topic

  AlarmesEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmesTopic
      Protocol: email
      Endpoint: !Ref EmailAdmin

  # ---------------------------------------------------------------------------
  # API
  # ---------------------------------------------------------------------------
  AvaliacaoApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      StageName: prod
      # Republica a API a cada deploy. Sem isso, quando uma funcao e substituida
      # (por exemplo, ao mudar o tipo de pacote), o estagio continua apontando
      # para a funcao antiga, ja removida, e a API responde 500.
      AlwaysDeploy: true
      Auth:
        ApiKeyRequired: true
        UsagePlan:
          CreateUsagePlan: PER_API
          Description: Plano de uso da API de avaliacoes
          Quota:
            Limit: 5000
            Period: DAY
          Throttle:
            RateLimit: 10
            BurstLimit: 20
      MethodSettings:
        - HttpMethod: '*'
          ResourcePath: '/*'
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
          MetricsEnabled: true

  # ---------------------------------------------------------------------------
  # Logs
  # ---------------------------------------------------------------------------
  AvaliacaoLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  NotificacaoLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  RelatorioLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  VersaoLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  # ---------------------------------------------------------------------------
  # Funcoes
  # ---------------------------------------------------------------------------
  AvaliacaoFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Todas as funcoes usam a mesma imagem; o que muda e o handler
      PackageType: Image
      ImageUri: !Ref ImagemUri
      ImageConfig:
        Command:
          - adjt.fase4.feedback.handler.AvaliacaoHandler::handleRequest
      Description: Recebe a avaliacao, valida, classifica, grava e publica alerta se critica
      LoggingConfig:
        LogGroup: !Ref AvaliacaoLogGroup
        LogFormat: JSON
      Environment:
        Variables:
          TABELA_AVALIACOES: !Ref AvaliacoesTable
          TOPICO_CRITICO_ARN: !Ref AlertasCriticosTopic
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AvaliacoesTable.Arn
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref AlertasCriticosTopic
      Events:
        PostAvaliacao:
          Type: Api
          Properties:
            RestApiId: !Ref AvaliacaoApi
            Path: /avaliacao
            Method: post

  NotificacaoCriticaFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Todas as funcoes usam a mesma imagem; o que muda e o handler
      PackageType: Image
      ImageUri: !Ref ImagemUri
      ImageConfig:
        Command:
          - adjt.fase4.feedback.handler.NotificacaoCriticaHandler::handleRequest
      Description: Envia por e-mail o alerta de feedback critico ao administrador
      LoggingConfig:
        LogGroup: !Ref NotificacaoLogGroup
        LogFormat: JSON
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt NotificacaoDLQ.Arn
      Environment:
        Variables:
          EMAIL_REMETENTE: !Ref EmailRemetente
          EMAIL_ADMIN: !Ref EmailAdmin
      Policies:
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*'
              Condition:
                StringEquals:
                  ses:FromAddress: !Ref EmailRemetente
      Events:
        AlertaCritico:
          Type: SNS
          Properties:
            Topic: !Ref AlertasCriticosTopic

  RelatorioSemanalFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Todas as funcoes usam a mesma imagem; o que muda e o handler
      PackageType: Image
      ImageUri: !Ref ImagemUri
      ImageConfig:
        Command:
          - adjt.fase4.feedback.handler.RelatorioSemanalHandler::handleRequest
      Description: Gera o relatorio semanal de feedbacks e envia por e-mail ao administrador
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref RelatorioLogGroup
        LogFormat: JSON
      Environment:
        Variables:
          TABELA_AVALIACOES: !Ref AvaliacoesTable
          INDICE_POR_DIA: por-dia
          EMAIL_REMETENTE: !Ref EmailRemetente
          EMAIL_ADMIN: !Ref EmailAdmin
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub '${AvaliacoesTable.Arn}/index/por-dia'
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*'
              Condition:
                StringEquals:
                  ses:FromAddress: !Ref EmailRemetente
      Events:
        SemanalSegunda:
          Type: Schedule
          Properties:
            Schedule: cron(0 12 ? * MON *)
            Description: Toda segunda-feira as 12h UTC (9h em Brasilia)

  VersaoFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Todas as funcoes usam a mesma imagem; o que muda e o handler
      PackageType: Image
      ImageUri: !Ref ImagemUri
      ImageConfig:
        Command:
          - adjt.fase4.feedback.handler.VersaoHandler::handleRequest
      Description: Informa a versao da aplicacao que esta publicada
      LoggingConfig:
        LogGroup: !Ref VersaoLogGroup
        LogFormat: JSON
      Events:
        GetVersao:
          Type: Api
          Properties:
            RestApiId: !Ref AvaliacaoApi
            Path: /versao
            Method: get
            # Consulta publica, sem dados: usada pelo pipeline e por quem opera
            Auth:
              ApiKeyRequired: false

  # ---------------------------------------------------------------------------
  # Monitoramento
  # ---------------------------------------------------------------------------
  AlertaNaoPublicadoMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AvaliacaoLogGroup
      FilterPattern: '"ALERTA_CRITICO_NAO_PUBLICADO"'
      MetricTransformations:
        - MetricNamespace: !Ref AWS::StackName
          MetricName: AlertaCriticoNaoPublicado
          MetricValue: '1'
          DefaultValue: 0

  AlertaNaoPublicadoAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Feedback critico gravado, mas o alerta nao pode ser publicado no topico
      Namespace: !Ref AWS::StackName
      MetricName: AlertaCriticoNaoPublicado
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmesTopic

  AvaliacaoErrosAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Erros de execucao (falha de inicializacao ou tempo esgotado) na funcao que recebe avaliacoes
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AvaliacaoFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmesTopic

  NotificacaoErrosAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Falha no envio do e-mail de alerta critico
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref NotificacaoCriticaFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmesTopic

  NotificacaoDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Alerta critico nao entregue apos as tentativas (mensagem na DLQ)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt NotificacaoDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmesTopic

  RelatorioErrosAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Falha na geracao ou envio do relatorio semanal
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RelatorioSemanalFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmesTopic

  ApiErros5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Respostas 5XX na API de avaliacoes
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub '${AWS::StackName}-api'
        - Name: Stage
          Value: prod
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmesTopic

  FeedbackDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Invocacoes das funcoes",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${AvaliacaoFunction}"],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${NotificacaoCriticaFunction}"],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${RelatorioSemanalFunction}"]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Erros das funcoes",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${AvaliacaoFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${NotificacaoCriticaFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${RelatorioSemanalFunction}"]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "API: requisicoes e erros",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiName", "${AWS::StackName}-api", "Stage", "prod"],
                  ["AWS/ApiGateway", "4XXError", "ApiName", "${AWS::StackName}-api", "Stage", "prod"],
                  ["AWS/ApiGateway", "5XXError", "ApiName", "${AWS::StackName}-api", "Stage", "prod"]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Duracao da funcao de avaliacoes (ms)",
                "region": "${AWS::Region}",
                "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${AvaliacaoFunction}", {"stat": "Average"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "${AvaliacaoFunction}", {"stat": "p99"}]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "Alertas criticos com problema",
                "region": "${AWS::Region}",
                "period": 300,
                "metrics": [
                  ["${AWS::StackName}", "AlertaCriticoNaoPublicado", {"stat": "Sum"}],
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${NotificacaoDLQ.QueueName}", {"stat": "Maximum"}]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "DynamoDB: capacidade consumida",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  ["AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${AvaliacoesTable}"],
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${AvaliacoesTable}"]
                ]
              }
            }
          ]
        }

Outputs:
  ApiUrl:
    Description: URL do endpoint POST /avaliacao
    Value: !Sub 'https://${AvaliacaoApi}.execute-api.${AWS::Region}.amazonaws.com/prod/avaliacao'
  VersaoUrl:
    Description: URL do endpoint GET /versao
    Value: !Sub 'https://${AvaliacaoApi}.execute-api.${AWS::Region}.amazonaws.com/prod/versao'
  Versao:
    Description: Versao publicada
    Value: !Ref Versao
  ApiKeyId:
    Description: Identificador da chave de API (o valor e obtido com aws apigateway get-api-key --include-value)
    Value: !Ref AvaliacaoApiApiKey
  TabelaAvaliacoes:
    Description: Nome da tabela DynamoDB
    Value: !Ref AvaliacoesTable
  RelatorioSemanalFunctionName:
    Description: Nome da funcao do relatorio, para disparo manual no teste
    Value: !Ref RelatorioSemanalFunction
  NotificacaoDLQUrl:
    Description: Fila com os alertas criticos que nao puderam ser entregues
    Value: !Ref NotificacaoDLQ
  DashboardUrl:
    Description: Painel de monitoramento no CloudWatch
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${FeedbackDashboard}'
