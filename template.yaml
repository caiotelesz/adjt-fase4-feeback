AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Plataforma serverless de feedback de aulas (Tech Challenge Fase 4)

Parameters:
  EmailRemetente:
    Type: String
    Description: E-mail remetente, precisa estar verificado no SES
    AllowedPattern: '[^@\s]+@[^@\s]+\.[^@\s]+'
  EmailAdmin:
    Type: String
    Description: E-mail do administrador, recebe alertas, relatorio e alarmes
    AllowedPattern: '[^@\s]+@[^@\s]+\.[^@\s]+'

Globals:
  Function:
    Runtime: java21
    Architectures:
      - arm64
    MemorySize: 512
    Timeout: 15
    CodeUri: target/feedback-platform-1.0-SNAPSHOT.jar

Resources:
  AvaliacoesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  AlertasCriticosTopic:
    Type: AWS::SNS::Topic

  AlarmesTopic:
    Type: AWS::SNS::Topic

  AlarmesEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmesTopic
      Protocol: email
      Endpoint: !Ref EmailAdmin

  AvaliacaoApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      StageName: prod
      MethodSettings:
        - HttpMethod: '*'
          ResourcePath: '/*'
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
          MetricsEnabled: true

  AvaliacaoLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  NotificacaoLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  RelatorioLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  AvaliacaoFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: adjt.fase4.feedback.handler.AvaliacaoHandler::handleRequest
      Description: Recebe a avaliacao, valida, classifica, grava e publica alerta se critica
      LoggingConfig:
        LogGroup: !Ref AvaliacaoLogGroup
      Environment:
        Variables:
          TABELA_AVALIACOES: !Ref AvaliacoesTable
          TOPICO_CRITICO_ARN: !Ref AlertasCriticosTopic
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AvaliacoesTable.Arn
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref AlertasCriticosTopic
      Events:
        PostAvaliacao:
          Type: Api
          Properties:
            RestApiId: !Ref AvaliacaoApi
            Path: /avaliacao
            Method: post

  NotificacaoCriticaFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: adjt.fase4.feedback.handler.NotificacaoCriticaHandler::handleRequest
      Description: Envia por e-mail o alerta de feedback critico ao administrador
      LoggingConfig:
        LogGroup: !Ref NotificacaoLogGroup
      Environment:
        Variables:
          EMAIL_REMETENTE: !Ref EmailRemetente
          EMAIL_ADMIN: !Ref EmailAdmin
      Policies:
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*'
              Condition:
                StringEquals:
                  ses:FromAddress: !Ref EmailRemetente
      Events:
        AlertaCritico:
          Type: SNS
          Properties:
            Topic: !Ref AlertasCriticosTopic

  RelatorioSemanalFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: adjt.fase4.feedback.handler.RelatorioSemanalHandler::handleRequest
      Description: Gera o relatorio semanal de feedbacks e envia por e-mail ao administrador
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref RelatorioLogGroup
      Environment:
        Variables:
          TABELA_AVALIACOES: !Ref AvaliacoesTable
          EMAIL_REMETENTE: !Ref EmailRemetente
          EMAIL_ADMIN: !Ref EmailAdmin
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Scan
              Resource: !GetAtt AvaliacoesTable.Arn
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*'
              Condition:
                StringEquals:
                  ses:FromAddress: !Ref EmailRemetente
      Events:
        SemanalSegunda:
          Type: Schedule
          Properties:
            Schedule: cron(0 12 ? * MON *)
            Description: Toda segunda-feira as 12h UTC (9h em Brasilia)

  AvaliacaoErrosAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Erros na funcao que recebe avaliacoes
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AvaliacaoFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmesTopic

  NotificacaoErrosAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Falha no envio do e-mail de alerta critico
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref NotificacaoCriticaFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmesTopic

  RelatorioErrosAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Falha na geracao ou envio do relatorio semanal
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RelatorioSemanalFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmesTopic

  ApiErros5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Respostas 5XX na API de avaliacoes
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub '${AWS::StackName}-api'
        - Name: Stage
          Value: prod
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmesTopic

  FeedbackDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Invocacoes das funcoes",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${AvaliacaoFunction}"],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${NotificacaoCriticaFunction}"],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${RelatorioSemanalFunction}"]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Erros das funcoes",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${AvaliacaoFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${NotificacaoCriticaFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${RelatorioSemanalFunction}"]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "API: requisicoes e erros",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiName", "${AWS::StackName}-api", "Stage", "prod"],
                  ["AWS/ApiGateway", "4XXError", "ApiName", "${AWS::StackName}-api", "Stage", "prod"],
                  ["AWS/ApiGateway", "5XXError", "ApiName", "${AWS::StackName}-api", "Stage", "prod"]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Duracao da funcao de avaliacoes (ms)",
                "region": "${AWS::Region}",
                "stat": "Average",
                "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${AvaliacaoFunction}"]
                ]
              }
            }
          ]
        }

Outputs:
  ApiUrl:
    Description: URL do endpoint POST /avaliacao
    Value: !Sub 'https://${AvaliacaoApi}.execute-api.${AWS::Region}.amazonaws.com/prod/avaliacao'
  TabelaAvaliacoes:
    Description: Nome da tabela DynamoDB
    Value: !Ref AvaliacoesTable
  RelatorioSemanalFunctionName:
    Description: Nome da funcao do relatorio, para disparo manual no teste
    Value: !Ref RelatorioSemanalFunction
