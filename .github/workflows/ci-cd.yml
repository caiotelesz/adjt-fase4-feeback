name: CI/CD

# Em pull requests para a main e em pushes na main: compila, roda os testes, valida o template e
# constroi a imagem das funcoes. No push para a main (ou disparo manual): envia
# a imagem ao Amazon ECR, publica na AWS com o SAM, confere a versao que ficou
# no ar e registra a release no GitHub.
#
# Mudancas que so tocam documentacao nao disparam o pipeline: nao ha o que
# testar nem publicar, e uma release sem alteracao de codigo so gera ruido.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
    steps:
      - uses: actions/checkout@v4
        with:
          # As tags definem o numero da proxima versao
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      # A serie (maior.menor) vem do pom.xml; o ultimo numero cresce sozinho a
      # cada publicacao, a partir da ultima tag vMAIOR.MENOR.N existente.
      - name: Definir a versao
        id: versao
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          BASE=$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout)
          SERIE=${BASE%.*}
          ULTIMA=$(git tag --list "v${SERIE}.*" --sort=-v:refname | head -n 1)
          if [ -z "$ULTIMA" ]; then
            CORRECAO=${BASE##*.}
          else
            CORRECAO=$(( ${ULTIMA##*.} + 1 ))
          fi
          VERSAO="${SERIE}.${CORRECAO}"
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"
          echo "Versao desta execucao: **$VERSAO** (ultima publicada: ${ULTIMA:-nenhuma})" >> "$GITHUB_STEP_SUMMARY"

      - name: Compilar, testar e medir cobertura
        run: mvn -B verify

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Validar o template
        run: sam validate --lint --region us-east-2

      # Garante, ja no pull request, que o Dockerfile continua valido
      - uses: docker/setup-buildx-action@v3

      - name: Construir a imagem das funcoes
        run: docker buildx build --platform linux/arm64 --provenance=false --tag feedback-platform:verificacao .

      - name: Guardar o pacote das funcoes
        uses: actions/upload-artifact@v7
        with:
          name: feedback-platform
          path: target/feedback-platform.jar
          if-no-files-found: error
          retention-days: 7

      - name: Guardar o relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: target/site/jacoco
          retention-days: 7

  deploy:
    name: Deploy na AWS
    needs: build
    # Somente no repositorio oficial. Em um fork, o fluxo roda ate os testes: o
    # fork nao tem os segredos, e o papel de deploy na AWS nao confia nele.
    if: github.repository == 'caiotelesz/adjt-fase4-feeback' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      STACK_NAME: ${{ vars.STACK_NAME || 'feedback-platform' }}
      EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
      EMAIL_ADMIN: ${{ secrets.EMAIL_ADMIN }}
      VERSAO: ${{ needs.build.outputs.versao }}
    steps:
      - uses: actions/checkout@v4

      - name: Baixar o pacote das funcoes
        uses: actions/download-artifact@v8
        with:
          name: feedback-platform
          path: target

      # Autenticacao por OIDC: o GitHub assume um papel na AWS, sem chave de acesso guardada.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # O repositorio e publico: o numero da conta nao deve aparecer nos logs
          mask-aws-account-id: true

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # A imagem leva a versao como tag, mas o deploy usa o digest (o
      # identificador do conteudo), que nao pode ser trocado depois.
      # --provenance=false gera o formato de manifesto aceito pelo Lambda.
      - name: Construir e enviar a imagem das funcoes
        run: |
          set -euo pipefail
          REPOSITORIO=$(aws ecr describe-repositories \
            --repository-names "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'repositories[0].repositoryUri' \
            --output text)
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --tag "$REPOSITORIO:$VERSAO" \
            --push .
          DIGEST=$(aws ecr describe-images \
            --repository-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --image-ids "imageTag=$VERSAO" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          echo "REPOSITORIO=$REPOSITORIO" >> "$GITHUB_ENV"
          echo "IMAGEM_URI=$REPOSITORIO@$DIGEST" >> "$GITHUB_ENV"
          echo "Imagem enviada: \`$STACK_NAME:$VERSAO\` ($DIGEST)" >> "$GITHUB_STEP_SUMMARY"

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Publicar a pilha
        run: |
          sam deploy \
            --template-file template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --image-repository "$REPOSITORIO" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --on-failure DELETE \
            --parameter-overrides \
              "ImagemUri=$IMAGEM_URI" \
              "EmailRemetente=$EMAIL_REMETENTE" \
              "EmailAdmin=$EMAIL_ADMIN" \
              "Versao=$VERSAO" \
              "Commit=${GITHUB_SHA::7}"

      - name: Mostrar as saidas da pilha
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[].[OutputKey,OutputValue]' \
            --output table

      # A release so e registrada se a aplicacao no ar responder com a versao nova.
      - name: Conferir a versao publicada
        run: |
          set -euo pipefail
          URL=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='VersaoUrl'].OutputValue" \
            --output text)
          for tentativa in 1 2 3 4 5 6; do
            NO_AR=$(curl -fsS --max-time 20 "$URL" | jq -r '.versao' || true)
            if [ "$NO_AR" = "$VERSAO" ]; then
              echo "Versao $NO_AR no ar em $URL"
              echo "Publicada a versao **$NO_AR** em $URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Tentativa $tentativa: esperava $VERSAO, obtive '${NO_AR:-sem resposta}'"
            sleep 10
          done
          exit 1

  release:
    name: Registrar a release
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSAO: ${{ needs.build.outputs.versao }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Baixar o pacote publicado
        uses: actions/download-artifact@v8
        with:
          name: feedback-platform
          path: pacote

      # A tag vX.Y.Z aponta para o commit publicado; as notas listam os PRs
      # incluidos desde a release anterior e o pacote fica anexado.
      - name: Criar a tag e a release
        run: |
          set -euo pipefail
          mv pacote/feedback-platform.jar "feedback-platform-$VERSAO.jar"
          gh release create "v$VERSAO" "feedback-platform-$VERSAO.jar" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSAO" \
            --generate-notes
