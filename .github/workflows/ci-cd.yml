name: CI/CD

# Em todo push e pull request: compila, roda os testes e valida o template.
# No push para a main (ou disparo manual): publica a pilha na AWS com o SAM.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Compilar, testar e medir cobertura
        run: mvn -B verify

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Validar o template
        run: sam validate --lint --region us-east-2

      - name: Guardar o pacote das funcoes
        uses: actions/upload-artifact@v4
        with:
          name: feedback-platform
          path: target/feedback-platform.jar
          if-no-files-found: error
          retention-days: 7

      - name: Guardar o relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: target/site/jacoco
          retention-days: 7

  deploy:
    name: Deploy na AWS
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: producao
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      STACK_NAME: ${{ vars.STACK_NAME || 'feedback-platform' }}
      EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
      EMAIL_ADMIN: ${{ secrets.EMAIL_ADMIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Baixar o pacote das funcoes
        uses: actions/download-artifact@v4
        with:
          name: feedback-platform
          path: target

      # Autenticacao por OIDC: o GitHub assume um papel na AWS, sem chave de acesso guardada.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Publicar a pilha
        run: |
          sam deploy \
            --template-file template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --on-failure DELETE \
            --parameter-overrides "EmailRemetente=$EMAIL_REMETENTE" "EmailAdmin=$EMAIL_ADMIN"

      - name: Mostrar as saidas da pilha
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[].[OutputKey,OutputValue]' \
            --output table
